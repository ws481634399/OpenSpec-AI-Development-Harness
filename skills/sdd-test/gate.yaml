# OpenSpec SDD Gate 配置（Phase 1.5）
# 见 phase-1.5-workflow-engine-design.md §11

stage: test
artifact: evidence/test-report.md

# Phase 4.1 轻量化：advisory fail 只记 warning 不阻断；skip-tier 命中 evidence-tier 时跳过
machine-checks:
  - required-front-matter
  - no-placeholder
  - required-sections
  - { id: cross-reference-valid, severity: advisory } # 引用缺失/误报只警告不卡流程
  - evidence-coverage # Phase 2.1：test-run 覆盖机检（轻量仍有价值，保持 blocking）
  - { id: evidence-trace, skip-tier: [light] } # Phase 4.3 S4：test-report 引用的 TC-NNN 必须存在于 test-design.md（追踪链仪式检查，light 档跳过）
  - { id: du-fan-in-testing, skip-tier: [light] } # Phase 2.4：所有 DU status ≥ testing（单仓轻量档跳过）

# Phase 2.1 evidence-coverage 开关（phase-2.1-evidence-system-design.md §4.2）
evidence-coverage:
  repos-coverage: false
  test-coverage: true # 至少 1 条 result != failed 的 test-run 条目

required-front-matter: []

required-replacements:
  - change-id
  - implementation-source
  - evidence-index

non-empty-ai-sections:
  - "## 2. 测试执行汇总"

human-checks:
  - "## 1. 测试范围"
  - "## 3. 证据清单"

# Phase 4.2 三级规格分层：3-tier 多 Story 时 test-report 落 stories/<id>/evidence/，
# workflow 传 storyId 激活 story mode（路径分发 + DU Fan-in 检查限定该 Story）；检查项不变。
three-tier:
  story-artifact: evidence/test-report.md
