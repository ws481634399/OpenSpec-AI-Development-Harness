# OpenSpec SDD Gate 配置（Phase 1.5）
# 见 phase-1.5-workflow-engine-design.md §11

stage: test
artifact: evidence/test-report.md

machine-checks:
  - required-front-matter
  - no-placeholder
  - required-sections
  - cross-reference-valid
  - evidence-coverage # Phase 2.1：test-run 覆盖机检
  - du-fan-in-testing # Phase 2.4：所有 DU status ≥ testing

# Phase 2.1 evidence-coverage 开关（phase-2.1-evidence-system-design.md §4.2）
evidence-coverage:
  repos-coverage: false
  test-coverage: true # 至少 1 条 result != failed 的 test-run 条目

required-front-matter: []

required-replacements:
  - change-id
  - implementation-source
  - evidence-index

non-empty-ai-sections:
  - "## 2. 测试执行汇总"

human-checks:
  - "## 1. 测试范围"
  - "## 3. 证据清单"
