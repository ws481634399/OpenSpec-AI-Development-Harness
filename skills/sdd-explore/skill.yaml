# OpenSpec SDD Skill 定义
#
# 版本: 0.2.0
# 类型: Skill 元数据 + Artifact Contract
#
# Skill 是 SDD 生命周期阶段能力，用于生成和演进 Artifact。
# Phase 1.4 实现 Skill 定义与调用框架，不执行 AI（由外部 Agent 按 Instruction 执行）。
# skill.yaml 字段对齐 Phase 1.3 Skill Contract（id/stage/input/output/requires-state/produces-state）。

id: sdd-explore # Skill 标识（与目录名一致）
version: 0.2.0 # Skill 版本
stage: explore # SDD 阶段名（对齐 context-rules.yaml stages 键）
description: 需求探索阶段 Skill——理解需求、判断 Feature 归属、初始化 Change 载体并产出探索结果
input: # Skill 输入（语义说明，非强类型）
  - requirement # 需求来源（REQ-XXX 或用户直接输入 title + content）
  - product/feature-tree.yaml # Feature Tree（判断归属）
  - standards/sdd/ # SDD 标准（change-lifecycle 等）
output: # Skill 输出（语义说明）
  - requirement.md # 需求原文沉淀
  - exploration.md # 探索分析产物
  - change # 初始化 CHG 载体
  - metadata-update # 更新 metadata.features
requires-state: created # 前置状态（CHG 必须处于 created）
produces-state: exploring # 产出状态（执行后推进到 exploring）
output-artifacts: # Artifact Contract，引用 templates/artifacts/ 模板
  - requirement.md
  - exploration.md
prompts: # Phase 2.3：引用 prompts/ 提示片段（相对 prompts/，不含 .md）
  - common/persona-sdd
  - common/constraints
  - common/output-format
  - explore/persona-explore
