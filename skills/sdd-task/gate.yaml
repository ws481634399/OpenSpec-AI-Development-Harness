# OpenSpec SDD Gate 配置（Phase 1.5）
# 见 phase-1.5-workflow-engine-design.md §11

stage: task
artifact: tasks.md

# Phase 4.1 轻量化：advisory fail 只记 warning 不阻断；skip-tier 命中 evidence-tier 时跳过
machine-checks:
  - required-front-matter
  - no-placeholder
  - required-sections
  - { id: cross-reference-valid, severity: advisory } # 引用缺失/误报只警告不卡流程
  - { id: test-design-exists, skip-tier: [light] } # Phase 4.3 S3：双产物——test-design.md 与 tasks.md 同批产出（light 档跳过：light 不强制全产物仪式）
  - { id: tc-coverage, skip-tier: [light] } # Phase 4.3 S4：每个 AC-NNN 至少被一个 TC-NNN verified-by（追踪链仪式检查，light 档跳过）
  - { id: du-coverage, skip-tier: [light] } # Phase 2.4：DU 覆盖对齐（单仓轻量档跳过；structural 强约束留给 S4 ac-coverage 等追踪链机检）
  - { id: du-guidance, skip-tier: [light] } # Phase 2.5：DU Implementation Guidance 完整性（单仓轻量档跳过）
  - { id: du-source-of-truth, skip-tier: [light] } # Phase 4.3 S2：tasks.md 引用的 DU 必须在 design DU 划分表定义

required-front-matter: []

required-replacements:
  - change-id
  - design-source

non-empty-ai-sections:
  - "## 任务清单"

human-checks:
  - "## 任务清单"

# Phase 4.2 三级规格分层：3-tier 多 Story 时 tasks.md 逐 Story 生成（stories/<id>/tasks.md），
# workflow 传 storyId 激活 story mode；DU 覆盖/指导检查自动限定该 Story 的 DU 集合。
three-tier:
  story-artifact: tasks.md
  story-machine-checks:
    - { id: scope-subset, target: du } # DU Scope ⊆ Story Scope（[S<n>] 编号引用；无引用条目仅 warning）
    - { id: du-source-of-truth, skip-tier: [light] } # Phase 4.3 S2：tasks.md DU 引用 ⊆ story-design DU 表
