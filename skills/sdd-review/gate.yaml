# OpenSpec SDD Gate 配置（Phase 2.2）
# 见 plans/phase-2.2-sdd-review-skill-design.md §4.3
# sdd-review 是同态检查点：双门禁通过后 artifact 置 accepted，但不推进 Change 状态

stage: review
artifact: review-report.md

# Phase 4.1 轻量化：advisory fail 只记 warning 不阻断；skip-tier 命中 evidence-tier 时跳过
machine-checks:
  - required-front-matter
  - no-placeholder
  - required-sections
  - { id: cross-reference-valid, severity: advisory } # 引用缺失/误报只警告不卡流程
  - evidence-coverage # findings-closure: blocker/major finding 必须闭环（review 兜底核心，保持 blocking）
  - { id: du-fan-in-complete, skip-tier: [light] } # Phase 2.4：所有 DU completed（Fan-in 前置，单仓轻量档跳过）

# Phase 2.1/2.2 evidence-coverage 开关
evidence-coverage:
  repos-coverage: false
  test-coverage: false
  findings-closure: true # blocker/major 的 review-finding 必须填写非空 resolution

required-front-matter: []

required-replacements:
  - change-id
  - test-report-source
  - evidence-index

non-empty-ai-sections:
  - "## 1. 检查结论"
  - "## 2. 发现清单"

human-checks:
  - "## 1. 检查结论"
  - "## 3. 完成确认"

# Phase 4.2 三级规格分层：3-tier 多 Story 时 review-report.md 落 stories/<id>/，
# workflow 传 storyId 激活 story mode（路径分发 + DU Fan-in 检查限定该 Story）；检查项不变。
three-tier:
  story-artifact: review-report.md
