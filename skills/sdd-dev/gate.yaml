# OpenSpec SDD Gate 配置（Phase 1.5）
# 见 phase-1.5-workflow-engine-design.md §11

stage: dev
artifact: implementation.md

# Phase 4.1 轻量化：advisory fail 只记 warning 不阻断；skip-tier 命中 evidence-tier 时跳过
machine-checks:
  - required-front-matter
  - no-placeholder
  - required-sections
  - { id: cross-reference-valid, severity: advisory } # 引用缺失/误报只警告不卡流程
  - { id: evidence-coverage, skip-tier: [light] } # Phase 2.1：Commit ↔ Evidence 对齐机检（轻量档免逐 commit 映射）
  - { id: du-materialized, skip-tier: [light] } # Phase 2.4：全部 DU 已物化到仓库（单仓轻量档跳过）
  - { id: red-green-record, severity: advisory } # Phase 4.3 S3：evidence 每 DU 至少一条红→绿记录（advisory，防造假靠人审）

# Phase 2.1 evidence-coverage 开关（phase-2.1-evidence-system-design.md §4.2）
evidence-coverage:
  repos-coverage: true # implementation.md 每个 Commit 必须有对应 code-change 条目
  test-coverage: false

required-front-matter: []

required-replacements:
  - change-id
  - tasks-source
  - primary-repo

non-empty-ai-sections:
  - "## 2. Commit 记录"

human-checks:
  - "## 2. Commit 记录"
  - "## 4. 与 Task 对应关系"

# Phase 4.2 三级规格分层：3-tier 多 Story 时 implementation.md / evidence/ 落 stories/<id>/，
# workflow 传 storyId 激活 story mode（路径分发 + DU/Evidence 检查限定该 Story）；检查项不变。
three-tier:
  story-artifact: implementation.md
