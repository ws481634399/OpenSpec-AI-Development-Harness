# OpenSpec Change Metadata
#
# 版本: v2（Phase 2.4 Multi-Repository Delivery）
# 类型: Change Metadata（SDD 生命周期载体元信息）
#
# 由 ChangeModel.runChangeCreate 生成（sdd-explore 内部调用）。
# v2 增量：schema-version / feature-path / repository-baseline / repository-result
# 兼容规则：schema-version 缺失视为 v1（features 扁平表 → feature-path 未绑定）；
#          旧 Change 仅在被显式操作（bind-feature-path / du materialize）时升级为 v2。
# 后续 status/archive 由 Document API 改写（保留注释）。

schema-version: 2 # 1 = 旧格式（仅 features 扁平表）；2 = 本格式

id: "" # CHG-XXXX，创建时填
title: "" # 简短标题
summary: "" # 一句话摘要（可选）
status: created # 见 Lifecycle State（change-lifecycle.md §4）：created/exploring/specified/designed/tasked/developing/testing/completed/archived
requirement: "" # 需求来源 REQ-XXX（sdd-explore 记录，对齐 requirement.md front-matter.id）
created-at: "" # ISO8601，创建时填
updated-at: "" # ISO8601，每次状态变更更新
features: # 影响的 Feature/Story id 扁平冗余索引（v2 起由 feature-path 推导，保留供旧读者兼容；可空）
  # v1 ID 规范：MOD-xxx / FEAT-xxx / STORY-xxx
  # v2 嵌套编码：FEAT-001 / FEAT-001-02 / FEAT-001-02-03 / STORY-001-02-03-01
  # - STORY-001-02-03-01
repositories: # 影响的仓库 id 列表（对应 .sdd/repositories.yaml，可空）
  # - backend
related-change: "" # 关联的历史 CHG-XXXX（需求复用 archived Change 时记录，可空）

# Phase 2.4 新增：feature-path（完整四级链，权威字段；STORY 目录物化是其投影）
# 约束：CHG ↔ Story = 1:1；树唯一权威源是 product/feature-tree.yaml，此处为"引用不是副本"
# candidate: explore 产出 Candidate 且未晋升时为 true（此时无法进入 task 阶段）
feature-path: # 可空；sdd-explore Story 匹配或 bind-feature-path 时写入
  # level-1: { id: FEAT-001, name: 用户中心 }
  # level-2: { id: FEAT-001-02, name: 账户能力 }
  # level-3: { id: FEAT-001-02-03, name: 用户认证 }
  # story: { id: STORY-001-02-03-01, name: 用户注册 }
  # candidate: false

# Phase 2.4 新增：仓库 Baseline / Result（DU 物化与完成时由 delivery-unit.js 写入）
# repository-baseline：DU materialize 时记录各仓起始 commit（可由 du sync-status 刷新）
# repository-result：DU completed 时记录各仓结果 commit
# 与 Submodule Pointer 的一致性由 converge 阶段 submodule-pointer-aligned 机检
repository-baseline: {}
  # backend: { commit: abc111 }
repository-result: {}
  # backend: { commit: abc999 }

# Phase 1.5 保留：artifacts 段（Gate Result 持久化）
# GateRepository 用 setIn 按需创建 artifacts.<name>.gates.{machine,human} 节点（不预填 7 个，避免模板臃肿）
# 每个 artifact 节点结构示例（实际由 GateRepository 写入时填充）：
#   <artifact-name>:
#     path: <artifact-path>
#     status: draft          # draft / accepted
#     gates:
#       machine:
#         status: pending    # pending / passed / failed
#         checked-at: ""     # ISO8601
#         validator: ""      # skill id（如 sdd-prd）
#         artifact-hash: ""  # sha256:...
#         issues: []         # failed 时的未通过项
#       human:
#         status: pending    # pending / approved / rejected / bypassed
#         reviewed-at: ""
#         reviewer: ""
#         artifact-hash: ""
#         reason: ""         # bypassed 时的理由
artifacts: {}
